# Publishes the app to GitHub Pages on every push to main.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Until that is switched on, this workflow fails
# at the "Configure Pages" step and nothing is published.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # "/<repo>/" for a project site, "/" for a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Serve the app for deep links
        # Pages has no rewrite rules; its 404 page doubles as the app shell.
        # The privacy page gets a real file of its own, because the people and
        # robots who check that link expect a page that says "200 OK".
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/privacy
          cp dist/index.html dist/privacy/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e

  accounts:
    # Sign-in and sync against a real database. The Supabase stack is started
    # in Docker from supabase/, the same way `npx supabase start` does locally;
    # the services the app doesn't use are left out to save a minute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep Supabase's ports free
        # supabase/config.toml keeps the stack's ports below the range Linux
        # hands out to outgoing connections, so nothing should be sitting on
        # them. This holds that true even on a machine with a wider range, and
        # shows what is there if a start ever fails on a port again.
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=24320-24330
          cat /proc/sys/net/ipv4/ip_local_port_range
          sudo ss -Htanp '( sport >= :24320 and sport <= :24330 )' || true
      - name: Start Supabase
        run: npx supabase start -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Database tests
        run: npm run test:cloud
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Two-device tests
        run: npm run test:e2e:cloud
